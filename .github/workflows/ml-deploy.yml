name: SageMaker Deployment
on:
  workflow_run:
    workflows: ["Sage Maker Custom Container"]
    types:
      - completed

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  MODEL_OUTPUT: ${{ secrets.MODEL_OUTPUT }}
  ROLE_ARN: ${{ secrets.ROLE_ARN }}
  AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
  MODEL_NAME: ${{ secrets.MODEL_NAME }}
  SAGEMAKER_ENDPOINT: ${{ secrets.SAGEMAKER_ENDPOINT }}
  IMAGE_URI: ${{ env.IMAGE_URI }}

jobs:
  deploy-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Read image URI from artifact
        uses: actions/github-script@v7
        with:
          script: |
              const fs = require('fs');
              const path = require('path');
              const { execSync } = require('child_process');
              const artifactName = 'image_info.json';
              const artifact = await github.rest.actions.listWorkflowRunArtifacts({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id: context.payload.workflow_run.id
                  });
      
              const imageArtifact = artifact.data.artifacts.find(a => a.name === artifactName);
              console.log('Found artifact:', imageArtifact.name);
              // Download the artifact (returns a zip)
              const download = await github.rest.actions.downloadArtifact({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    artifact_id: imageArtifact.id,
                    archive_format: 'zip'
                  });
              // Save zip to disk
              const buffer = Buffer.from(download.data, 'base64');
              const zipPath = path.join(process.cwd(), 'artifact.zip');
              fs.writeFileSync(zipPath, buffer);
              // Unzip and read JSON
              execSync(`unzip -o ${zipPath} -d ./artifact`);
              const jsonPath = path.join('./artifact', 'image.json');
              const data = fs.readFileSync(jsonPath, 'utf8');
              const json = JSON.parse(data);
              // Parse output 
              console.log('IMAGE_URI:', json.image_uri);
              // Pass the variable to the next step
              fs.appendFileSync(process.env.GITHUB_ENV, `IMAGE_URI=${json.image_uri}\n`);

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.9

      - name: Install dependencies
        run: |
          pip install "sagemaker>=2.0.0,<3.0.0" dotenv boto3

      - name: Deploy model
        run: |
          echo "Using IMAGE_URI=$IMAGE_URI"
          python ML/src/deploy.py
