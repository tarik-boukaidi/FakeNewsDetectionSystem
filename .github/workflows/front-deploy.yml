name: Frontend Deploy to S3

on:
  push:
    branches:
      - master
    paths:
      - "frontend/fake-news-detector-vite/**"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Install dependencies
        working-directory: frontend/fake-news-detector-vite
        run: npm install --legacy-peer-deps

      - name : Check Build folder
        run: ls frontend/fake-news-detector-vite/build  
      - name: Build React app
        working-directory: frontend/fake-news-detector-vite
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Sync build folder to S3
        run: |
          aws s3 sync frontend/fake-news-detector-vite/build s3://${{ secrets.FRONT_END_BUCKET }}  --delete
