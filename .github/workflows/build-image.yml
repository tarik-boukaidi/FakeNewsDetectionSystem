name: Sage Maker Custom Container 
on:
  push:
    branches:
      - master
jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read
    steps:
      - name: checkout the repo 
        uses: actions/checkout@v3

      - name: aws credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-region : ${{ secrets.AWS_DEFAULT_REGION }}
          role-to-assume: ${{ secrets.ROLE_ARN }}
      - name: Debug IAM user
        run: aws sts get-caller-identity

      - name: login to acr
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build Docker image
        run: |
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPO_NAME }}:latest"
          echo $IMAGE_URI
          docker build -t $IMAGE_URI -f ML/src/Dockerfile .

          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

          echo "{ \"image_uri\": \"$IMAGE_URI\" }" > image-info.json

      - name: Push image
        run: docker push $IMAGE_URI

      - name: Upload artifact for deploy job
        uses: actions/upload-artifact@v4
        with:
          name: image-info
          path: image-info.json
